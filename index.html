<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OROCLIN · Central de Documentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --marrom:#3D2B1F; --madeira:#C8A882; --gold:#A67C34;
    --bege:#EDE3D2; --cream:#F4EEE3; --paper:#FBF8F2;
    --muted:#7A6A5A; --line:#E0D5C4; --danger:#A63C2B;
    --serif:'Cormorant Garamond',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);color:var(--marrom);background:var(--cream);line-height:1.6;font-weight:300;-webkit-font-smoothing:antialiased}
  button{font-family:var(--sans);cursor:pointer;border:none}
  input,select{font-family:var(--sans);font-size:15px}
  .hidden{display:none!important}

  /* LOGIN */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:44px 38px;width:100%;max-width:400px;text-align:center;box-shadow:0 10px 40px rgba(61,43,31,.08)}
  .login-card img{width:210px;margin:0 auto 6px}
  .login-sub{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:30px}
  .login-card h1{font-family:var(--serif);font-weight:600;color:var(--marrom);font-size:26px;margin-bottom:6px}
  .login-card p.hint{color:var(--muted);font-size:13.5px;margin-bottom:26px}
  .field{text-align:left;margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
  .field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--marrom)}
  .field input:focus{outline:none;border-color:var(--madeira)}
  .btn{background:var(--marrom);color:var(--cream);padding:12px 20px;border-radius:9px;font-weight:600;font-size:15px;width:100%;transition:opacity .15s}
  .btn:hover{opacity:.9}
  .btn.gold{background:var(--gold)}
  .btn.ghost{background:transparent;color:var(--marrom);border:1px solid var(--line);width:auto}
  .btn.sm{width:auto;padding:9px 16px;font-size:13.5px}
  .msg{font-size:13.5px;margin-top:14px;min-height:18px}
  .msg.err{color:var(--danger)} .msg.ok{color:var(--gold)}

  /* APP */
  header.top{background:var(--paper);border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:10}
  header.top img{height:30px}
  .top-right{display:flex;align-items:center;gap:14px}
  .who{font-size:13px;color:var(--muted)}
  .wrap{max-width:1040px;margin:0 auto;padding:30px 26px 80px}
  .page-title{font-family:var(--serif);font-weight:600;font-size:32px;color:var(--marrom);margin-bottom:4px}
  .page-sub{color:var(--muted);font-size:15px;margin-bottom:24px}
  .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:26px}
  .search{flex:1;min-width:220px;padding:11px 14px;border:1px solid var(--line);border-radius:9px;background:#fff}
  .search:focus{outline:none;border-color:var(--madeira)}

  .cat{margin-bottom:30px}
  .cat h2{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .doc{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:4px}
  .doc .ic{width:34px;height:34px;border-radius:8px;background:var(--bege);display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:700;font-size:13px;margin-bottom:6px}
  .doc .t{font-weight:600;color:var(--marrom);font-size:15.5px;line-height:1.3}
  .doc .meta{font-size:12.5px;color:var(--muted)}
  .doc .actions{display:flex;gap:8px;margin-top:12px}
  .doc .actions .btn{width:auto;flex:1;padding:9px 12px;font-size:13.5px}
  .doc .del{background:transparent;color:var(--danger);border:1px solid var(--line);flex:0 0 auto;padding:9px 12px;border-radius:9px;font-size:13.5px}
  .empty{color:var(--muted);font-size:15px;padding:40px 0;text-align:center}

  .banner{background:var(--bege);border-left:4px solid var(--gold);border-radius:0 10px 10px 0;padding:14px 18px;margin-bottom:24px;font-size:14px;color:var(--marrom)}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(61,43,31,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal{background:var(--paper);border-radius:16px;padding:30px;width:100%;max-width:440px}
  .modal h3{font-family:var(--serif);font-size:24px;color:var(--marrom);margin-bottom:18px}
  .modal .field select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--marrom)}
  .modal .row{display:flex;gap:10px;margin-top:8px}
  .file-drop{border:1.5px dashed var(--madeira);border-radius:10px;padding:16px;text-align:center;color:var(--muted);font-size:13.5px;background:#fff}
</style>
</head>

function configOk(){ return !SUPABASE_URL.includes("SEU-PROJETO") && !SUPABASE_ANON_KEY.includes("SUA-ANON-KEY"); }

function init(){
  if(!configOk()){
    // mostra a tela de login mas avisa que falta configurar

    $("loginMsg").textContent="Configure SUPABASE_URL e SUPABASE_ANON_KEY no topo do arquivo.";

  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.getSession().then(({data})=>{ if(data.session){ onLogged(data.session.user); } });
}

async function doLogin(){
  const email=$("email").value.trim(), senha=$("senha").value;
  $("loginMsg").className="msg"; $("loginMsg").textContent="Entrando...";
  const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
  if(error){ $("loginMsg").className="msg err"; $("loginMsg").textContent="E-mail ou senha inválidos."; return; }
  onLogged(data.user);
}

function onLogged(user){
  currentUser=user;
  isAdmin = ADMIN_EMAILS.map(e=>e.toLowerCase()).includes((user.email||"").toLowerCase());
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("who").textContent = user.email;
  $("btnAdd").style.display = isAdmin ? "inline-block" : "none";
  loadDocs();
}

async function logout(){ await sb.auth.signOut(); location.reload(); }

async function loadDocs(){
  $("docs").innerHTML='<div class="empty">Carregando...</div>';
  const { data, error } = await sb.from("documentos").select("*").order("categoria").order("titulo");
  if(error){ $("docs").innerHTML='<div class="empty">Erro ao carregar. Verifique a tabela "documentos" e as permissões (RLS).</div>'; return; }
  allDocs = data||[];
  render();
}

function render(){
  const q = $("search").value.trim().toLowerCase();
  const filtered = allDocs.filter(d=>!q || (d.titulo||"").toLowerCase().includes(q));
  if(filtered.length===0){ $("docs").innerHTML='<div class="empty">Nenhum documento por aqui ainda.</div>'; return; }
  const byCat={};
  filtered.forEach(d=>{ (byCat[d.categoria] = byCat[d.categoria]||[]).push(d); });
  let html="";
  CATEGORIAS.concat(Object.keys(byCat).filter(c=>!CATEGORIAS.includes(c))).forEach(cat=>{
    const items=byCat[cat]; if(!items||!items.length) return;
    html += '<div class="cat"><h2>'+esc(cat)+'</h2><div class="grid">';
    items.forEach(d=>{
      const ext=(d.arquivo_path||"").split(".").pop().toUpperCase().slice(0,4);
      html += '<div class="doc"><div class="ic">'+esc(ext||"DOC")+'</div>'
            + '<div class="t">'+esc(d.titulo)+'</div>'
            + '<div class="meta">'+fmtSize(d.tamanho)+' · '+fmtDate(d.created_at)+'</div>'
            + '<div class="actions"><button class="btn sm" onclick="baixar(\''+d.id+'\')">Baixar</button>'
            + (isAdmin?'<button class="del" onclick="excluir(\''+d.id+'\')">Excluir</button>':'')
            + '</div></div>';
    });
    html += '</div></div>';
  });
  $("docs").innerHTML=html;
}

async function baixar(id){
  const d = allDocs.find(x=>String(x.id)===String(id)); if(!d) return;
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(d.arquivo_path, 120, { download:true });
  if(error){ alert("Não foi possível gerar o download."); return; }
  window.open(data.signedUrl, "_blank");
}

async function excluir(id){
  const d = allDocs.find(x=>String(x.id)===String(id)); if(!d) return;
  if(!confirm('Excluir "'+d.titulo+'"?')) return;
  await sb.storage.from(BUCKET).remove([d.arquivo_path]);
  await sb.from("documentos").delete().eq("id", d.id);
  loadDocs();
}

/* ----- upload (admin) ----- */
function openModal(){
  $("mCat").innerHTML = CATEGORIAS.map(c=>'<option>'+esc(c)+'</option>').join("");
  $("mTitulo").value=""; $("mFile").value=""; $("mMsg").textContent="";
  $("modal").classList.remove("hidden");
}
function closeModal(){ $("modal").classList.add("hidden"); }

async function salvar(){
  const titulo=$("mTitulo").value.trim(), cat=$("mCat").value, file=$("mFile").files[0];
  if(!titulo||!file){ $("mMsg").className="msg err"; $("mMsg").textContent="Preencha o título e escolha um arquivo."; return; }
  $("mMsg").className="msg"; $("mMsg").textContent="Enviando...";
  const safe = file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const path = cat.replace(/[^a-zA-Z0-9]/g,"_")+"/"+Date.now()+"_"+safe;
  const up = await sb.storage.from(BUCKET).upload(path, file);
  if(up.error){ $("mMsg").className="msg err"; $("mMsg").textContent="Erro no upload: "+up.error.message; return; }
  const ins = await sb.from("documentos").insert({ titulo, categoria:cat, arquivo_path:path, tamanho:file.size });
  if(ins.error){ $("mMsg").className="msg err"; $("mMsg").textContent="Erro ao registrar: "+ins.error.message; return; }
  closeModal(); loadDocs();
}

/* ----- helpers ----- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtSize(b){ if(!b) return "—"; if(b<1024) return b+" B"; if(b<1048576) return (b/1024).toFixed(0)+" KB"; return (b/1048576).toFixed(1)+" MB"; }
function fmtDate(s){ if(!s) return ""; const d=new Date(s); return d.toLocaleDateString("pt-BR"); }

/* ----- listeners ----- */
$("btnLogin").onclick=doLogin;
$("senha").addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });
$("btnLogout").onclick=logout;
$("btnAdd").onclick=openModal;
$("mCancel").onclick=closeModal;
$("mSave").onclick=salvar;
$("search").addEventListener("input",render);
init();
</script>
</body>
</html>
